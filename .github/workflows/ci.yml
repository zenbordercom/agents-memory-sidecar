name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
        if: matrix.node-version == '24.x'
      - run: npm run audit:all
        if: matrix.node-version == '24.x'
      - run: npm run typecheck
      - run: npm run build
      - run: npm run docs:check
      - run: npm test
      - run: npm run coverage
        if: matrix.node-version == '24.x'
      - run: npm run smoke
      - run: npm run http:smoke
      - run: npm run http:bridge-smoke
      - run: npm run http:security-smoke

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agent_memory
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_memory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Ensure app role exists for grant regression
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d agent_memory -tc \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'agent_memory_app') THEN CREATE ROLE agent_memory_app LOGIN; END IF; END \$\$"
      - name: Create disposable database for the pg regression suite
        run: |
          # The service container is fresh per run; tolerate "already exists".
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE sidecar_pg_test" || true
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d sidecar_pg_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: npm test
        env:
          AGENT_MEMORY_TEST_PG: "1"
          PGHOST: 127.0.0.1
          PGDATABASE: sidecar_pg_test
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: npm run build
      - run: npm run db:migrate
        env:
          PGHOST: 127.0.0.1
          PGDATABASE: agent_memory
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: npm run postgres:smoke
        env:
          PGHOST: 127.0.0.1
          PGDATABASE: agent_memory
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: npm run search:benchmark
        env:
          AGENT_MEMORY_BACKEND: postgres
          PGHOST: 127.0.0.1
          PGDATABASE: agent_memory
          PGUSER: postgres
          PGPASSWORD: postgres

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run compose:smoke
